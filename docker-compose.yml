services:

  postgres:
    image: pgvector/pgvector:pg17
    container_name: aapli-wari-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: aapli_wari
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5433"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: aapli-wari-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data: